[project]
name = "offeriq"
version = "0.1.0"
description = "Personalised offer engine for Indian e-commerce: uplift-aware, rule-guarded, Claude-personalised"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-telegram-bot>=21.6",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "pyarrow>=26.0.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.48",
    "faker>=40.43.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
